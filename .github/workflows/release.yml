# Creates a GitHub release for each new version of CalcMap.
#
# On every push to main: if the tag v<VERSION> (VERSION constant of
# src/basic/CalcMap.bas) does not exist yet, builds the extension, then creates
# the tag and the release "CalcMap <VERSION>", described by the matching
# section of CHANGELOG.md, with CalcMap.oxt attached. A push without a new
# version does nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          v=$(python3 tools/release_notes.py version)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
            echo "Release v$v already exists: nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.new == 'true'
        run: python3 tools/release_notes.py notes "${{ steps.version.outputs.version }}" > notes.md

      - name: Build the extension
        if: steps.version.outputs.new == 'true'
        run: python3 build.py

      - name: Create the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "v$v" dist/CalcMap.oxt \
            --target "$GITHUB_SHA" \
            --title "CalcMap $v" \
            --notes-file notes.md
